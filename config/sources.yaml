# Every place the digest collects news from.
#
# - To add a source: copy a block of the same `type`, give it a new `id`,
#   and put its URL in config/app.env.
# - To pause a source: set `enabled: false`.
# - `group` and `icon` are used by the website (filters and logos).
# - ${NAME} means "the value of NAME from config/app.env" (or .env / environment).

settings:
  windowHours: 36        # only keep items published in the last N hours
  requestTimeout: 30     # seconds per HTTP request

sources:
  # --- AI labs and research blogs (RSS feeds) ---
  - id: openai
    name: OpenAI
    type: rss
    group: labs
    icon: openai
    url: ${OPENAI_FEED_URL}

  - id: deepmind
    name: Google DeepMind
    type: rss
    group: labs
    icon: deepmind
    url: ${DEEPMIND_FEED_URL}

  - id: huggingface
    name: Hugging Face
    type: rss
    group: research
    icon: huggingface
    url: ${HUGGINGFACE_FEED_URL}

  - id: bair
    name: BAIR Blog
    type: rss
    group: research
    icon: arxiv
    url: ${BAIR_FEED_URL}

  - id: mistral
    name: Mistral AI
    type: rss
    group: labs
    icon: mistralai
    url: ${MISTRAL_FEED_URL}

  - id: microsoft-research
    name: Microsoft Research
    type: rss
    group: labs
    icon: microsoft
    url: ${MICROSOFT_RESEARCH_FEED_URL}

  - id: nvidia
    name: NVIDIA (generative AI)
    type: rss
    group: labs
    icon: nvidia
    url: ${NVIDIA_GENAI_FEED_URL}
    maxItems: 5

  - id: nvidia-developer
    name: NVIDIA Developer (generative AI)
    type: rss
    group: labs
    icon: nvidia
    url: ${NVIDIA_DEVELOPER_GENAI_FEED_URL}
    maxItems: 5

  - id: meta-engineering
    name: Meta Engineering (ML)
    type: rss
    group: labs
    icon: meta
    url: ${META_ENGINEERING_ML_FEED_URL}
    maxItems: 3

  - id: qwen
    name: Qwen
    type: rss
    group: labs
    icon: qwen
    url: ${QWEN_BLOG_FEED_URL}
    maxItems: 3

  # --- Hugging Face: where new open models and papers appear first ---
  - id: hf-papers
    name: Hugging Face Daily Papers
    type: huggingFacePapers
    group: research
    icon: huggingface
    minUpvotes: 10          # only papers the community has upvoted

  - id: hf-trending
    name: Hugging Face Trending Models
    type: huggingFaceTrendingModels
    group: research
    icon: huggingface
    limit: 10

  # --- Cloud platforms: new GenAI products and features ---
  # These feeds cover everything the vendor ships, so only AI titles are kept.
  - id: aws-whats-new
    name: AWS What's New
    type: rss
    group: cloud
    icon: amazonwebservices
    url: ${AWS_WHATS_NEW_FEED_URL}
    maxItems: 10
    titleFilter: &cloudAiOnly
      include:
        - '\b(ai|genai|generative|llm|llms|agents?|agentic|bedrock|sagemaker|q developer|amazon q|nova|foundry|vertex|gemini|copilot|openai|model|models|inference|rag|prompt|mcp|embeddings?)\b'

  - id: aws-ml-blog
    name: AWS Machine Learning Blog
    type: rss
    group: cloud
    icon: amazonwebservices
    url: ${AWS_ML_BLOG_FEED_URL}
    maxItems: 8

  - id: azure-blog
    name: Azure Blog
    type: rss
    group: cloud
    icon: microsoft
    url: ${AZURE_BLOG_FEED_URL}
    maxItems: 6
    titleFilter: *cloudAiOnly

  - id: google-cloud-ai
    name: Google Cloud AI Blog
    type: rss
    group: cloud
    icon: googlecloud
    url: ${GOOGLE_CLOUD_AI_FEED_URL}
    maxItems: 8

  # --- Research papers (arXiv publishes ~450 a day: keep a few on core GenAI topics) ---
  - id: arxiv
    name: arXiv (cs.AI, cs.CL)
    type: rss
    group: research
    icon: arxiv
    url: ${ARXIV_AI_CL_FEED_URL}
    respectCacheControl: true  # the feed changes once a day: fetch it once a day, not every run
    maxItems: 8
    titleFilter:
      include:
        - '\b(llms?|language models?|agents?|agentic|reasoning|alignment|agi|reinforcement learning|rlhf|chain-of-thought|in-context|retrieval|rag|multimodal|transformers?|foundation models?|evaluation|benchmark)\b'

  # --- GenAI newsletters and technical writing ---
  - id: latent-space
    name: Latent Space
    type: rss
    group: newsletters
    icon: substack
    url: ${LATENT_SPACE_FEED_URL}
    maxItems: 3

  - id: import-ai
    name: Import AI
    type: rss
    group: newsletters
    icon: substack
    url: ${IMPORT_AI_FEED_URL}
    maxItems: 3

  - id: interconnects
    name: Interconnects
    type: rss
    group: newsletters
    icon: substack
    url: ${INTERCONNECTS_FEED_URL}
    maxItems: 3

  - id: ahead-of-ai
    name: Ahead of AI
    type: rss
    group: newsletters
    icon: substack
    url: ${AHEAD_OF_AI_FEED_URL}
    maxItems: 3

  - id: medium-genai
    name: Medium (generative-ai)
    type: rss
    group: newsletters
    icon: medium
    url: ${MEDIUM_GENAI_FEED_URL}
    maxItems: 5

  # --- Anthropic has no RSS feed, so we read its news page ---
  - id: anthropic
    name: Anthropic
    type: webPage
    group: labs
    icon: anthropic
    url: ${ANTHROPIC_NEWS_URL}
    selectors:
      item: 'a[href^="/news/"]'       # each news card is a link to /news/<slug>
      title: '[class*="__title"]'     # class names are auto-generated, so match on the stable part
      date: time

  # --- Community ---
  - id: hackernews
    name: Hacker News
    type: hackerNews
    group: community
    icon: ycombinator
    minPoints: 50
    keywords: [AI, LLM, LLMs, GPT, Claude, Gemini, OpenAI, Anthropic, DeepMind, "language model", AGI, MCP, RAG,
               diffusion, transformer, "Hugging Face", Llama, Mistral, DeepSeek, Qwen, agent, agents]

  - id: reddit
    name: Reddit   # r/MachineLearning, r/LocalLLaMA, r/singularity, r/artificial
    type: rss
    group: community
    icon: reddit
    url: ${REDDIT_AI_FEED_URL}
    maxItems: 15

  # --- YouTube (RSS first; falls back to the YouTube API if YOUTUBE_API_KEY is set) ---
  # Whole channels are followed: every run picks up their newest uploads.
  - id: ai-explained
    name: AI Explained
    type: youtube
    group: video
    icon: youtube
    channelId: UCNJ1Ymd5yFuUPtn21xtRbbw     # every video is news analysis: no filter

  # Krish Naik posts mostly tutorials, courses and bootcamps, with the occasional
  # news/trend video. The filter keeps only titles that look like news and are not
  # tutorials; the Phase 2 video scout agent double-checks what gets through.
  - id: krish-naik
    name: Krish Naik
    type: youtube
    group: video
    icon: youtube
    channelId: UCNU_lfiiWBdtULKOw6X0Dig
    titleFilter: &newsVideosOnly
      include:                              # keep a video only if its title matches one of these
        - '\bwill\b.*\breplace'             # "Will BDH replace Transformers?"
        - '\bexplained\b'
        - '\bwhat is\b'
        - '\bis changing\b'
        - '\b(launch|launches|launched|released?|announc\w*|introducing|unveil\w*)\b'
        - '\b(news|update|breakthrough|future of|state of)\b'
        - '\b(gpt|claude|gemini|llama|qwen|deepseek|mistral|grok|sora)[- ]?\d'  # a model version
        - '\bpost-transformer\b'
      exclude:                              # ...and drop it if its title matches any of these
        - 'crash course'
        - '\b(course|bootcamp|tutorial|roadmap|certification|udemy|induction)\b'
        - '\b(live|marathon|session|interview|podcast)\b'
        - '\b(build|building|built|implement\w*|step by step|hands-on|end to end|project)\b'
        - '\bcomplete\b'
        - '\b(getting started|introduction to|learn|beginners?)\b'
        - '(^|\s)#?\d+\s*-'                 # series episodes: "7-Introduction...", "#1-New Series"
        - '\bpart \d+'

  - id: krish-naik-hindi
    name: Krish Naik Hindi
    type: youtube
    group: video
    icon: youtube
    channelId: UCjWY5hREA6FFYrthD0rZNIw
    titleFilter: *newsVideosOnly

  # --- Newsletters (read from a dedicated Gmail inbox; see README) ---
  - id: newsletters
    name: Newsletters
    type: newsletterInbox
    group: newsletters
    icon: gmail
    enabled: false          # turn on once GMAIL_ADDRESS and GMAIL_APP_PASSWORD are set
    label: newsletters      # Gmail label the newsletters are filtered into
    senders:                # part of the sender's address -> display name
      tldr: TLDR AI
      rundown: The Rundown AI
      superhuman: Superhuman AI
      alphasignal: AlphaSignal

  # --- Web search: fresh GenAI news the feeds don't cover (tagged "AI-assisted") ---
  # Free tier: 1,000 searches/month, so 4 queries per run, rotating through this list.
  - id: web-search
    name: Web search
    type: webSearch
    group: webSearch
    icon: search
    queriesPerRun: 4
    resultsPerQuery: 5
    days: 2
    queries:
      - new LLM model release announced
      - new AI agent framework or SDK released
      - AWS Bedrock OR Azure AI Foundry OR Vertex AI new generative AI feature
      - site:linkedin.com generative AI launch announcement
      - site:x.com AI lab announces new model
      - Y Combinator AI agent startup launch
      - Meta AI OR xAI OR Cohere OR DeepSeek new model
      - agentic AI enterprise use case deployed
      - AGI research statement from AI lab
      - Coimbatore artificial intelligence startup news
      - MCP server OR model context protocol new release
      - new prompting OR reasoning technique for LLMs paper
