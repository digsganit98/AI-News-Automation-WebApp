# Opens weekly pull requests to keep dependencies and GitHub Actions up to date.
# CI runs the tests on each one before you merge.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: weekly
    groups:
      website-dependencies:
        patterns: ["*"]
