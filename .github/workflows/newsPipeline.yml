# The news pipeline. Runs on GitHub's servers, so your computer can be off.
#
# Every 3 hours: collect new news and research papers from the sources in config/sources.yaml,
# let the scout and analyst agents turn them into stories, save the data, and republish the site.
#
# The agents need GROQ_API_KEY and/or GEMINI_API_KEY secrets; without them they're skipped and the
# site shows the plain collected feed.
name: News pipeline

on:
  schedule:
    # Times are UTC. IST = UTC + 5:30, and India has no daylight saving, so these never shift.
    - cron: "30 0,3,6,9,12,15,18,21 * * *" # 06:00, 09:00, 12:00 ... 03:00 IST, every 3 hours
  workflow_dispatch: # "Run workflow" button in the Actions tab
    inputs:
      dryRun:
        description: "Dry run: collect and print, but don't save anything"
        type: boolean
        default: false

permissions:
  contents: write # to commit the collected data

concurrency:
  group: news-pipeline # runs never overlap; a new one waits for the previous to finish
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Collect news and run the AI agents
        env:
          # Optional secrets; anything that needs a missing one is skipped.
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: uv run digest run ${{ inputs.dryRun && '--dry-run' || '' }}

      # always(): even if the agents crash, the news already collected is saved and published.
      - name: Save collected data to the repo
        if: ${{ always() && !inputs.dryRun }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "data: update $(TZ=Asia/Kolkata date '+%F %H:%M IST')"
            git pull --rebase
            git push
          fi

  # Rebuild and publish the website with the data just collected.
  # (Pushes made by this workflow don't trigger other workflows, so it's called directly.)
  website:
    needs: collect
    # Publish whatever was saved, even if part of the collect job failed.
    if: ${{ always() && !inputs.dryRun }}
    uses: ./.github/workflows/deploySite.yml
    permissions:
      contents: read
      pages: write
      id-token: write
