name: Edition backup trigger

on:
  schedule:
    - cron: "10 3 * * *"  # 08:40 IST — after your last morning attempt

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger edition if missing
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.ACCESS_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/digsganit98/AI-News-Automation-WebApp/actions/workflows/newsPipeline.yml/dispatches \
            -d '{"ref":"main","inputs":{"mode":"editionIfMissing","dryRun":false}}'