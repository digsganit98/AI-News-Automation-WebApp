# Builds the website (src/web) from the latest data and publishes it on GitHub Pages.
#
# Runs:  after every news-pipeline run (called from newsPipeline.yml),
#        when website code, data or config change on main,
#        or by hand from the Actions tab.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "src/web/**"
      - "data/**"
      - "config/**"
      - "docs/images/**"
      - ".github/workflows/deploySite.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Build from the newest main, including data the pipeline just committed.
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install
        working-directory: src/web
        run: npm ci

      - name: Build
        working-directory: src/web
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: src/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
