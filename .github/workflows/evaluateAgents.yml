# Scores how well the AI agents stick to their sources, on the saved test set
# (evals/groundingSet.json). Run it by hand before and after changing prompts or models:
# Actions -> "Evaluate agents" -> Run workflow. Results appear in the run summary and,
# if the Langfuse secrets are set, as a scored trace in Langfuse.
# Uses about 10 LLM calls on the free tiers.
name: Evaluate agents

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Run the grounding eval
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_ENVIRONMENT: eval
        run: uv run digest eval
