[project]
name = "genai-digest"
version = "0.1.0"
description = "Collects daily GenAI news from many sources and turns it into a digest."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "httpx>=0.27",
    "mcp>=1.9,<2",  # langchain-mcp-adapters does not support mcp 2.x yet
    "pydantic>=2.7",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "tenacity>=8.3",
    "trafilatura>=1.12",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
x = ["Scweet==5.8.0"]

[project.scripts]
digest = "digest.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]
pythonpath = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Long SVG / draw.io markup strings read better unwrapped.
"scripts/buildArchitectureDiagram.py" = ["E501"]
